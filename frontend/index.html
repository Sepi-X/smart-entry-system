<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Entry System Dashboard</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        
        .subtitle {
            opacity: 0.9;
            font-size: 1.1rem;
        }
        
        main {
            flex: 1;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }
        
        .card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #333;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.2);
        }
        
        .card h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #667eea;
        }
        
        .device-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
        }
        
        .device {
            background: #252525;
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .device.active {
            border-color: #667eea;
            background: #2a2a3a;
        }
        
        .device-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        
        .device-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        
        .device-status {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .status-on, .status-open, .status-unlocked, .status-disarmed {
            color: #4ade80;
        }
        
        .status-off, .status-closed, .status-locked, .status-armed {
            color: #ef4444;
        }
        
        .active-devices {
            margin-top: 1rem;
        }
        
        .active-device {
            background: #252525;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .active-device-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .active-device-icon {
            font-size: 1.5rem;
        }
        
        .active-device-details {
            font-size: 0.9rem;
        }
        
        .active-device-id {
            font-weight: 600;
        }
        
        .active-device-location {
            opacity: 0.8;
        }
        
        .event-log {
            max-height: 300px;
            overflow-y: auto;
            background: #252525;
            border-radius: 8px;
            padding: 1rem;
        }
        
        .event {
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            background: #1a1a1a;
            border-radius: 4px;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }
        
        .event-time {
            opacity: 0.6;
        }
        
        .controls {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .detecting {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <header>
        <h1>Smart Entry System</h1>
        <p class="subtitle">Secure Advertisement-Based Access Control</p>
    </header>
    
    <main>
        <div class="dashboard">
            <div class="card">
                <h2>IoT Devices</h2>
                <div class="device-grid" id="iotDevices">
                    <!-- IoT devices will be inserted here -->
                </div>
            </div>
            
            <div class="card">
                <h2>Active Smart Devices</h2>
                <div class="active-devices" id="activeDevices">
                    <p style="opacity: 0.6;">No devices detected</p>
                </div>
            </div>
            
            <div class="card">
                <h2>Event Log</h2>
                <div class="event-log" id="eventLog">
                    <!-- Events will be inserted here -->
                </div>
            </div>
        </div>
        
        <div class="card">
            <h2>Manual Controls</h2>
            <div class="controls">
                <button onclick="controlDevice('gates', 'open')">Open Gates</button>
                <button onclick="controlDevice('gates', 'close')">Close Gates</button>
                <button onclick="controlDevice('lights', 'on')">Lights On</button>
                <button onclick="controlDevice('lights', 'off')">Lights Off</button>
                <button onclick="controlDevice('alarm', 'arm')">Arm Alarm</button>
                <button onclick="controlDevice('alarm', 'disarm')">Disarm Alarm</button>
            </div>
        </div>
    </main>
    
    <script> //connects to Flask via socket.IO
        const socket = io('http://localhost:5001');
        //stores a list of 20max
        const eventLog = [];
        const maxEvents = 20;
        
        // Device icons
        const deviceIcons = {
            gates: '🚪',
            lights: '💡',
            garage: '🚗',
            bike_storage: '🚲',
            alarm: '🚨',
            smartphone: '📱',
            smartcar: '🚙',
            smartbike: '🚴'
        };
        
        // Initialize connection
        socket.on('connect', () => {
            addEvent('Connected to gateway');
        });
        
        // Handle IoT status updates
        socket.on('iot_status_update', (devices) => {
            updateIoTDevices(devices);
        });
        
        // Handle device detection (the gateway emits 'zone_activity' after each verified advertisement)
        socket.on('zone_activity', (data) => {
            const info = data.device_info;
            addEvent(`${info.device_type} (${info.device_id}) detected at ${info.location}`);
            updateActiveDevices();
        });

        // Show rejected / blocked attempts from the gateway's security log
        socket.on('security_event', (event) => {
            if (['authentication_failed', 'rate_limit_exceeded'].includes(event.event_type)) {
                addEvent(`⚠️ ${event.event_type.replace(/_/g, ' ')}: ${event.device_id}`);
            }
        });
        //Clears and repopulates the IoT(Adds class .active if status ...)
        function updateIoTDevices(devices) {
            const container = document.getElementById('iotDevices');
            container.innerHTML = '';
            
            Object.entries(devices).forEach(([name, device]) => {
                const deviceEl = document.createElement('div');
                deviceEl.className = `device ${device.status === 'on' || device.status === 'open' || device.status === 'unlocked' || device.status === 'disarmed' ? 'active' : ''}`;
                
                deviceEl.innerHTML = `
                    <div class="device-icon">${deviceIcons[name] || '📟'}</div>
                    <div class="device-name">${name.replace('_', ' ').toUpperCase()}</div>
                    <div class="device-status status-${device.status}">${device.status.toUpperCase()}</div>
                `;
                
                container.appendChild(deviceEl);
            });
        }
        
        //Fetches smart device(render active devices + animation and detection time)
        async function updateActiveDevices() {
            try {
                const response = await fetch('http://localhost:5001/status');
                const data = await response.json();
                
                const container = document.getElementById('activeDevices');
                container.innerHTML = '';
                
                const activeDevices = Object.entries(data.active_devices || {});
                
                if (activeDevices.length === 0) {
                    container.innerHTML = '<p style="opacity: 0.6;">No devices detected</p>';
                    return;
                }
                
                activeDevices.forEach(([id, device]) => {
                    const deviceEl = document.createElement('div');
                    deviceEl.className = 'active-device detecting';
                    
                    // last_seen comes from Python time.time() in seconds; JavaScript Date needs milliseconds
                    const lastSeen = new Date(device.last_seen * 1000);
                    const now = new Date();
                    const isRecent = (now - lastSeen) < 30000; // 30 seconds
                    
                    if (!isRecent) {
                        deviceEl.style.opacity = '0.5';
                    }
                    
                    deviceEl.innerHTML = `
                        <div class="active-device-info">
                            <div class="active-device-icon">${deviceIcons[device.device_type] || '📟'}</div>
                            <div class="active-device-details">
                                <div class="active-device-id">${id}</div>
                                <div class="active-device-location">📍 ${device.location}</div>
                            </div>
                        </div>
                        <div class="active-device-time">${lastSeen.toLocaleTimeString()}</div>
                    `;
                    
                    container.appendChild(deviceEl);
                });
            } catch (error) {
                console.error('Error updating active devices:', error);
            }
        }
        //Pushes a new message with timestamp into the event log array
        function addEvent(message) {
            const now = new Date();
            eventLog.unshift({
                message,
                time: now.toLocaleTimeString()
            });
            
            if (eventLog.length > maxEvents) {
                eventLog.pop();
            }
            
            renderEventLog();
        }
        //Displays the event log in the UI
        function renderEventLog() {
            const container = document.getElementById('eventLog');
            container.innerHTML = '';
            
            eventLog.forEach(event => {
                const eventEl = document.createElement('div');
                eventEl.className = 'event';
                eventEl.innerHTML = `
                    <span>${event.message}</span>
                    <span class="event-time">${event.time}</span>
                `;
                container.appendChild(eventEl);
            });
        }
        //Sends a POST request to control a device (open, arm ...)
        async function controlDevice(device, action) {
            try {
                const response = await fetch(`http://localhost:5001/control/${device}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ action })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    addEvent(`Manual control: ${device} ${action}`);
                } else {
                    addEvent(`Failed to control ${device}`);
                }
            } catch (error) {
                console.error('Error controlling device:', error);
                addEvent(`Error controlling ${device}`);
            }
        }
        
        // Initial load
        updateActiveDevices();
        
        // Periodic updates
        setInterval(updateActiveDevices, 5000);
    </script>
</body>
</html>
